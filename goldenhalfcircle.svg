<svg xmlns="http://w3.org" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="canvas-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Simple Golden Pile Gradient -->
    <linearGradient id="golden-pile-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a6f27" />
      <stop offset="30%" stop-color="#caa33d" />
      <stop offset="70%" stop-color="#f1cb65" />
      <stop offset="100%" stop-color="#fff0aa" />
    </linearGradient>

    <!-- Soft Ground Shadow Gradient -->
    <radialGradient id="ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.6)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <style>
    .canvas {
      fill: url(#canvas-grad);
    }
    .ground-line {
      stroke: #22222a;
      stroke-width: 2px;
      stroke-linecap: round;
    }
    .shadow {
      fill: url(#ground-shadow);
    }
    .golden-pile {
      fill: url(#golden-pile-grad);
    }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="500" class="canvas" />

  <!-- Ground Plane Environment -->
  <ellipse cx="400" cy="405" rx="320" ry="15" class="shadow" />
  <line x1="100" y1="400" x2="700" y2="400" class="ground-line" />

  <!-- Golden Pile Semi-Circle -->
  <!-- 
    Draws a perfect half-circle sitting cleanly on the flat base line (y=400).
    Starts at left edge (250, 400), arcs up to radius 150 (peak at 400, 250), 
    reaches right edge (550, 400), and closes straight across the ground plane.
  -->
  <path d="M 250,400 A 150,150 0 0,1 550,400 Z" class="golden-pile" />
</svg>
