<svg xmlns="http://w3.org" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Dark Ambient Canvas -->
    <linearGradient id="canvas-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111115" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- 3D Illusion Radial Gradient: Shifted center creates volumetric lighting -->
    <radialGradient id="golden-3d-sphere" cx="420%" cy="330%" r="65%" fx="420%" fy="330%">
      <!-- Off-center highlight -->
      <stop offset="0%" stop-color="#fff8cc" />
      <stop offset="15%" stop-color="#fcd86d" />
      <!-- Rich mid-tone gold body -->
      <stop offset="55%" stop-color="#c99827" />
      <!-- Deep core shadow for curvature wrap -->
      <stop offset="85%" stop-color="#735211" />
      <!-- Ambient rim light reflection at the edge -->
      <stop offset="100%" stop-color="#916f1f" />
    </radialGradient>

    <!-- Ground Contact Shadow -->
    <radialGradient id="ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.75)" />
      <stop offset="35%" stop-color="rgba(0, 0, 0, 0.4)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <style>
    .canvas {
      fill: url(#canvas-grad);
    }
    .ground-line {
      stroke: #1b1b22;
      stroke-width: 2px;
    }
    .shadow {
      fill: url(#ground-shadow);
    }
    .golden-pile {
      fill: url(#golden-3d-sphere);
    }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="500" class="canvas" />

  <!-- Ground Plane Environment -->
  <ellipse cx="400" cy="403" rx="220" ry="18" class="shadow" />
  <line x1="100" y1="400" x2="700" y2="400" class="ground-line" />

  <!-- 3D Illusion Golden Pile Semi-Circle -->
  <!-- 
    The shape remains a flat, clean 2D half-circle sitting on the y=400 ground line.
    By shifting the radial gradient's focal point (fx, fy) upward and slightly to the right, 
    the eye perceives a convex dome, turning a flat arc into a heavy, 3D physical object.
  -->
  <path d="M 250,400 A 150,150 0 0,1 550,400 Z" class="golden-pile" />
</svg>
