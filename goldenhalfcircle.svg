<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Base Circular Gradient (Vibrant Neon Contrast) -->
    <!-- The fx and fy variables shift the light source center to create dimension -->
    <radialGradient id="coolShinyBase" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#00f6ff" />
      <stop offset="40%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#110033" />
    </radialGradient>

    <!-- Overlay Gradient for the Glossy Shine Effect -->
    <radialGradient id="glossShine" cx="35%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#0a0518" />

  <!-- Main Circular Object -->
  <g id="shinyCircleGroup">
    <!-- Base Color Layer -->
    <circle id="baseLayer" cx="250" cy="250" r="180" fill="url(#coolShinyBase)" />
    
    <!-- Reflexive Shine Layer -->
    <circle id="shineLayer" cx="250" cy="250" r="180" fill="url(#glossShine)" pointer-events="none" />
    
    <!-- Subtle Inner Edge Highlight -->
    <circle id="edgeHighlight" cx="250" cy="250" r="179" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  </g>
</svg>
